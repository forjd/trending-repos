name: Deploy

# Deploys on every push to main (including PR merges), and on demand.
# Needs CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets in the
# production environment, which accepts deploys from main only.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - LICENSE
  workflow_dispatch:

# Never run two deploys at once; a newer push waits for the current one
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      # Only this step sees the Cloudflare token, not npm ci or the tests
      - name: Apply D1 migrations and deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

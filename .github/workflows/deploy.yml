name: Deploy

# Manual only for now: deploys run from the dev VM with `npm run deploy`.
# To deploy on every push, add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
# repo secrets, then uncomment the push trigger.
on:
  # push:
  #   branches: [main]
  workflow_dispatch:

# Never run two deploys at once; a newer push waits for the current one
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply trending-repos --remote

      - name: Deploy Worker
        run: npx wrangler deploy
